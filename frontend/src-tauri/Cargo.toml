[package]
name = "chatgpt-launcher-setup-ui"
version = "1.2.2"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "ChatGPT Launcher configuration window"
default-run = "chatgpt-launcher-setup-ui"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Only the separate test executable accepts isolated paths / writes test reports.
test-harness = ["windows-sys/Win32_Storage_FileSystem"]
ui-prototype = ["test-harness"]
program-sample = ["ui-prototype"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }
cc = "1"
serde_json = "1"

[dependencies]
# The Windows shell uses fixed capabilities. Runtime-added capabilities also keep
# the full permission manifests in memory after startup.
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# Use the same WebView2 bindings as the Tauri Windows runtime.
webview2-com = "0.39"
windows-sys = { version = "0.61", features = ["Win32_System_Environment"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[[test]]
name = "bridge-contract"
path = "../../tests/rust/bridge_contract.rs"
